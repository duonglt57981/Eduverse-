services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - eduverse_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStr0ng!Password"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - eduverse_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -C || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: eduverse-api:prod
    build:
      context: ./Eduverse_API
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    container_name: eduverse_api
    restart: unless-stopped
    env_file:
      - ./Eduverse_API/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Eduverse;User Id=sa;Password=YourStr0ng!Password;TrustServerCertificate=True;Encrypt=False;
      - Elasticsearch__Url=http://elasticsearch:9200
      - AllowedOrigins__0=https://eduverse.website
      - AllowedOrigins__1=https://www.eduverse.website
      - AllowedOrigins__2=https://localhost:3000
      - AllowedOrigins__3=https://${SERVER_HOST:-localhost}
      - FrontendUrl=https://eduverse.website
      - BackendUrl=https://api.eduverse.website
    depends_on:
      sqlserver:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - eduverse_net

  client:
    image: eduverse-client:prod
    build:
      context: ./eduverse_client
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://api.eduverse.website
    pull_policy: never
    container_name: eduverse_client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - eduverse_net

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: eduverse_npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - api
      - client
    networks:
      - eduverse_net

volumes:
  sqlserver_data:
  es_data:

networks:
  eduverse_net:
