version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - eduverse_net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStr0ng!Password"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - eduverse_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -C || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: eduverse-api:prod
    build:
      context: ./Eduverse_API
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    container_name: eduverse_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Eduverse;User Id=sa;Password=YourStr0ng!Password;TrustServerCertificate=True;Encrypt=False;
      - Elasticsearch__Url=http://elasticsearch:9200
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - eduverse_net

  client:
    image: eduverse-client:prod
    build:
      context: ./eduverse_client
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    container_name: eduverse_client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5002
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - eduverse_net

volumes:
  sqlserver_data:
  es_data:

networks:
  eduverse_net:
