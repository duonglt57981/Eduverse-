name: CI/CD Deploy to Ubuntu

# TODO: Goto Settings -> Environments -> Production -> Secrets and setup secrets (SSH_HOST, SSH_PASSWORD, SSH_USERNAME, API_ENV, CLIENT_ENV)
# After that, uncomment push to trigger auto deploy (don't need workflow_dispatch anymore)
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  pull_code:
    name: 1. Pull Latest Code
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH and Pull Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== Step 1: Pulling Latest Code ==="
            cd Eduverse/
            echo "Retrieving latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

  setup_env:
    name: 2. Setup Environment Files
    needs: pull_code
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH and Write Envs
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_ENV: ${{ secrets.API_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          envs: API_ENV,CLIENT_ENV
          script: |
            echo "=== Step 2: Injecting Environment Config ==="
            cd Eduverse/
            
            if [ ! -z "$API_ENV" ]; then
              echo "Writing API environment variables..."
              echo "$API_ENV" > Eduverse_API/.env
            else
              echo "API_ENV secret is empty, skipping..."
            fi
            
            if [ ! -z "$CLIENT_ENV" ]; then
              echo "Writing Client environment variables..."
              echo "$CLIENT_ENV" > eduverse_client/.env.local
            else
              echo "CLIENT_ENV secret is empty, skipping..."
            fi

  build_images:
    name: 3. Build Docker Images
    needs: setup_env
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH and Build Images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== Step 3: Building Docker Images ==="
            cd Eduverse/
            export BUILDKIT_PROGRESS=plain
            if command -v docker-compose &> /dev/null; then
              echo "Using docker-compose build..."
              docker-compose build --pull
            else
              echo "Using docker compose build..."
              docker compose build --pull
            fi

  start_containers:
    name: 4. Start Docker Containers
    needs: build_images
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH and Start Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== Step 4: Starting Docker Containers ==="
            cd Eduverse/
            
            # Stop host web servers that might conflict
            echo "Stopping conflicting host-level web servers..."
            sudo systemctl stop nginx || true
            sudo systemctl stop apache2 || true
            
            # Find and kill any other process occupying port 80 or 443
            echo "Checking for other processes on port 80/443..."
            for port in 80 443; do
              PID=$(sudo lsof -t -i:$port 2>/dev/null || true)
              if [ ! -z "$PID" ]; then
                echo "Found process on port $port (PID: $PID). Killing it..."
                sudo kill -9 $PID || true
              fi
            done

            # Stop and remove any other Docker containers binding to port 80 or 443
            echo "Checking for other Docker containers on port 80/443..."
            for port in 80 443; do
              CONTAINERS=$(docker ps --filter "publish=$port" -q)
              if [ ! -z "$CONTAINERS" ]; then
                echo "Stopping conflicting containers on port $port: $CONTAINERS"
                docker stop $CONTAINERS || true
                docker rm -f $CONTAINERS || true
              fi
            done
            
            if command -v docker-compose &> /dev/null; then
              echo "Using docker-compose up..."
              docker-compose up -d --quiet-pull
            else
              echo "Using docker compose up..."
              docker compose up -d --quiet-pull
            fi

  verify_containers:
    name: 5. Verify Running Containers
    needs: start_containers
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: SSH and Verify Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== Step 5: Verifying Container Startup ==="
            cd Eduverse/
            
            get_running_count() {
              if command -v docker-compose &> /dev/null; then
                docker-compose ps --filter "status=running" -q | wc -l
              else
                docker compose ps --filter "status=running" -q | wc -l
              fi
            }
            
            print_status() {
              if command -v docker-compose &> /dev/null; then
                docker-compose ps
              else
                docker compose ps
              fi
            }
            
            echo "Waiting for containers to start..."
            sleep 5
            
            # Loop for up to 90 seconds (18 iterations x 5 seconds) to allow database healthcheck to pass
            for i in {1..18}; do
              RUNNING_COUNT=$(get_running_count)
              echo "Currently running containers: $RUNNING_COUNT of 5"
              if [ "$RUNNING_COUNT" -eq 5 ]; then
                echo "All 5 containers are successfully running!"
                break
              fi
              sleep 5
            done
            
            echo "Final container status:"
            print_status
            
            FINAL_COUNT=$(get_running_count)
            if [ "$FINAL_COUNT" -ne 5 ]; then
              echo "Error: Only $FINAL_COUNT of 5 containers are running."
              exit 1
            fi
            
            echo "Deployment Finished Successfully!"
