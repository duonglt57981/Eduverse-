name: CI/CD Deploy to Ubuntu (Test Dev Manual)

on:
  push:
    branches:
      - main
jobs:
  pull_code:
    name: 1. Pull Latest Code
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Pull Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 110.172.29.244
          username: root
          password: "@Sieutoc!Zp2%kwNI@97"
          port: 22
